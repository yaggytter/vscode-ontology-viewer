name: Release VSIX

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify tag matches package version
        run: node -e "const expected='v'+require('./package.json').version;if(process.env.GITHUB_REF_NAME!==expected){throw new Error('Tag '+process.env.GITHUB_REF_NAME+' does not match '+expected)}"
      - run: npm audit --omit=dev
      - run: npm run verify
      - run: npm run package
      - run: npx vsce ls --tree --no-dependencies
      - name: Create checksums
        run: sha256sum *.vsix > SHA256SUMS
      - name: Upload immutable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ontology-viewer-${{ github.ref_name }}
          path: |
            *.vsix
            SHA256SUMS
          if-no-files-found: error
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            *.vsix
            SHA256SUMS
          body: |
            This is a draft release. Test the attached VSIX in clean English and Japanese VS Code profiles before publishing it to Visual Studio Marketplace.

            公開前に、添付したVSIXを英語・日本語の新しいVS Codeプロファイルでテストしてください。
